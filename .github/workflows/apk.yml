name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Baixar o leitor de PDF para dentro do app (funciona offline)
        run: |
          curl -fL -o app/src/main/assets/pdf.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fL -o app/src/main/assets/pdf.worker.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
      - name: Aceitar licenças do Android SDK (o SDK já vem no servidor)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug -Pvcode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Publicar APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DREAMS-debug.apk
          gh release delete debug-latest --cleanup-tag -y || true
          gh release create debug-latest DREAMS-debug.apk --prerelease \
            --title "APK do DREAMS (versão de teste)" \
            --notes "DREAMS para Android. Commit ${GITHUB_SHA}." \
            --target "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: DREAMS-apk
          path: DREAMS-debug.apk
