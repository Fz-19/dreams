<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DREAMS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
<title>DREAMS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: preto liso, uma faixa "Adicionar DREAMS" no topo e, abaixo, a grade "DREAMS adicionados". */
:root{
  --bg:#000; --surface:#101012; --surface-2:#18181b; --line:#232327;
  --fg:#f5f5f7; --muted:#8e8e93; --accent:#0a84ff; --danger:#ff453a;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  --mono:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:0 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding-top:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:44px;height:44px;display:block}
.brand span{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.icobtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.icobtn:active{background:var(--surface-2)}
.icobtn svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.search{display:none;margin-top:6px}
.search.on{display:block}
.search input{width:100%;height:46px;border-radius:14px;background:var(--surface);border:0;color:var(--fg);padding:0 16px;font:inherit;font-size:16px}
.addrow{display:flex;align-items:center;gap:16px;width:100%;margin-top:22px;padding:22px;border-radius:28px;background:var(--surface);text-align:left;transition:background .2s}
.addrow:active{background:var(--surface-2)}
.plus{width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.chev{margin-left:auto;width:20px;height:20px;flex:none;stroke:#48484a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.plus svg{width:24px;height:24px;stroke:#fff;stroke-width:2.2;stroke-linecap:round;fill:none}
.addrow b{display:block;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.015em}
.addrow small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 0 16px}
.head h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.025em}
.head span{font-size:17px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px}
.card{display:block;text-align:left;min-width:0}
.cover{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:24px;overflow:hidden;background:var(--surface);transition:transform .2s ease}
.card:active .cover{transform:scale(.97)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gen{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,hsl(var(--h) 22% 15%),hsl(var(--h) 20% 6%))}
.gen svg{width:58%;height:58%;display:block}
.tag{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:var(--fg)}
.ct{margin:11px 4px 0;font-weight:600;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cd{margin:3px 4px 0;color:var(--muted);font-size:14px}
.empty{grid-column:1/-1;color:var(--muted);padding:30px 0}
/* leitor */
.viewer{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;-webkit-overflow-scrolling:touch}
.vbar{position:sticky;top:0;z-index:2;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.vbar h2{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:38px;padding:0 14px;border-radius:99px;background:var(--surface-2);font-size:14px;font-weight:500}
.pill.danger{color:var(--danger)}
.pages{max-width:820px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.pages canvas{width:100%;height:auto;border-radius:6px;background:#fff;display:block}
.note{color:var(--muted);text-align:center;padding:60px 10px}
.note .pill{margin-top:16px;color:var(--fg)}
/* folha */
.back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.lbl{font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:500}
.f input[type=text],.f input[type=date]{height:48px;border-radius:14px;background:var(--surface-2);border:0;color:var(--fg);padding:0 14px;font:inherit;font-size:16px;width:100%}
.row{display:flex;gap:12px;align-items:stretch}
.prev{width:96px;height:96px;flex:none;border-radius:22px;overflow:hidden;position:relative;background:var(--surface-2)}
.prev img{width:100%;height:100%;object-fit:cover;display:block}
.pick{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:14px;background:var(--surface-2);font-weight:500;font-size:14px;padding:0 12px;cursor:pointer;text-align:center}
.fname{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.primary{height:52px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:17px}
.primary[disabled]{opacity:.4}
.ghost{height:44px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:1em}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
[hidden]{display:none!important}
.vbar{flex-wrap:wrap}
.vtabs,.seg{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--surface-2)}
.vtabs{flex-basis:100%}
.vtabs button,.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);padding:0 4px}
.vtabs button.on,.seg button.on{background:#3a3a3c;color:var(--fg)}
.stage{position:fixed;left:0;right:0;bottom:0;z-index:1;background:radial-gradient(70% 60% at 50% 38%,#18181c,#000);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.stage model-viewer,.stage iframe,.stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;border:0;display:block}
.stage model-viewer{--poster-color:transparent;background:transparent}
.stage canvas{touch-action:none;cursor:grab}
.stage iframe{background:#000}
.stage .note{position:absolute;inset:0;display:grid;place-content:center;padding:20px}
.shint{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none}
.shint span{font-size:13px;color:var(--muted)}
.shint button{pointer-events:auto;height:34px;padding:0 14px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600}
.tag3d{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:var(--fg)}
.ghost.sm{height:36px;font-size:14px;color:var(--danger)}
/* ===== abertura (motion) ===== */
body.intro{overflow:hidden}
body.intro .wrap{opacity:0}
body.intro .brand svg{opacity:0}
body.intro.reveal .wrap{opacity:1;transition:opacity .6s ease .15s}
.splash{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.sp-flash{position:absolute;inset:0;background:radial-gradient(60% 42% at 50% 44%,rgba(190,225,255,.6),rgba(10,132,255,.14) 55%,transparent 78%);opacity:0;animation:spFlash .75s ease calc(.95s*var(--k,1)) both}
.sp-stage{position:relative;width:176px;height:176px;z-index:2}
.sp-glow{position:absolute;left:50%;top:50%;width:480px;height:480px;margin:-240px 0 0 -240px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.32),transparent 62%);opacity:0;animation:spGlow 2.4s ease calc(.2s*var(--k,1)) both}
.sp-inner{position:absolute;inset:0;animation:spImpact .55s cubic-bezier(.2,.9,.3,1) calc(.95s*var(--k,1)) both}
.sp-half{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;opacity:0;will-change:transform,opacity}
.sp-half.l{clip-path:polygon(-57.55% -17.09%,64.67% -17.09%,43.21% 40.46%,58.50% 51.09%,24.98% 134.85%,-57.55% 134.85%);animation:spL calc(.8s*var(--k,1)) cubic-bezier(.16,1,.3,1) calc(.3s*var(--k,1)) both}
.sp-half.r{clip-path:polygon(64.67% -17.09%,151.38% -17.09%,151.38% 134.85%,24.98% 134.85%,58.50% 51.09%,43.21% 40.46%);animation:spR calc(.8s*var(--k,1)) cubic-bezier(.16,1,.3,1) calc(.3s*var(--k,1)) both}
.sp-bolt{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;filter:drop-shadow(0 0 5px #0a84ff) drop-shadow(0 0 16px #0a84ff);animation:spBolt .65s linear calc(.92s*var(--k,1)) both}
.sp-bolt path{fill:none;stroke:#e2f1ff;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw calc(.24s*var(--k,1)) cubic-bezier(.5,0,.8,.4) calc(.92s*var(--k,1)) forwards}
.sp-shine{position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 130% 0/260% 100% no-repeat;animation:spShine calc(.95s*var(--k,1)) cubic-bezier(.4,0,.2,1) calc(1.3s*var(--k,1)) both}
.sp-word{position:relative;display:flex;gap:.46em;margin-top:38px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--fg)}
.sp-word span{display:inline-block;opacity:0;transform:translateY(16px);filter:blur(8px);animation:spLetter .75s cubic-bezier(.2,.8,.2,1) calc((1.4s + var(--i)*.07s)*var(--k,1)) forwards}
.sp-tag{position:relative;margin-top:14px;font-size:13px;color:var(--muted);opacity:0;animation:spFade .8s ease calc(2s*var(--k,1)) forwards}
@keyframes spL{from{opacity:0;transform:translate(-38%,-6%) rotate(-10deg) scale(1.1);filter:blur(12px)}55%{opacity:1}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes spR{from{opacity:0;transform:translate(38%,6%) rotate(10deg) scale(1.1);filter:blur(12px)}55%{opacity:1}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes spImpact{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes spFlash{0%{opacity:0}16%{opacity:1}100%{opacity:0}}
@keyframes spGlow{0%{opacity:0;transform:scale(.7)}45%{opacity:1}100%{opacity:.6;transform:scale(1.1)}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spBolt{0%{opacity:0}8%{opacity:1}45%{opacity:1}100%{opacity:0}}
@keyframes spShine{to{background-position:-30% 0}}
@keyframes spLetter{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes spFade{to{opacity:1}}
/* ===== toques e transições ===== */
.pill,.btn,.primary,.addrow,.icobtn,.fab,.ghost{transition:transform .15s ease,background .2s ease}
.pill:active,.btn:active,.primary:active,.addrow:active,.icobtn:active,.ghost:active{transform:scale(.96)}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card.pop{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--idelay,0s) + var(--n,0)*45ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetIn{from{transform:translateY(70px);opacity:0}}
@keyframes vIn{from{transform:translateY(32px);opacity:0}}
.back:not([hidden]){animation:fadeIn .25s ease}
.sheet:not([hidden]){animation:sheetIn .34s cubic-bezier(.2,.8,.2,1)}
.viewer:not([hidden]){animation:vIn .34s cubic-bezier(.2,.8,.2,1)}
.pages:not([hidden]){animation:fadeIn .25s ease}
.stage>*{animation:fadeIn .35s ease}
.sheet{padding-top:36px}
.grab{position:absolute;top:0;left:0;right:0;height:36px;touch-action:none;cursor:grab}
.grab::after{content:"";position:absolute;left:50%;top:11px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:#3a3a3c}
.qdel{color:var(--danger)}
.tagr{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.tagr span{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:var(--fg)}
.fs{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(28,28,30,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;place-items:center}
.fs svg{width:20px;height:20px;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.viewer.imm .vbar{display:none}
.viewer.imm .stage{top:0!important}
.viewer.imm .fs{top:calc(10px + env(safe-area-inset-top,0px))!important}
.pages.z{overflow-x:auto;align-items:flex-start;max-width:none}
.pages canvas{max-width:none}
/* prompt */
.addrow.alt{margin-top:12px;padding:16px 20px;border-radius:24px}
.plus.alt{width:44px;height:44px;background:var(--surface-2)}
.plus.alt svg{width:22px;height:22px;stroke:var(--fg)}
.addrow.alt b{font-size:17px}
.phelp{margin:0;color:var(--muted);font-size:14px}
.ptext{width:100%;height:38dvh;min-height:180px;border:0;border-radius:14px;background:var(--surface-2);color:var(--fg);padding:12px 14px;font:inherit;font-size:16px;line-height:1.5;resize:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

(function(){
  var sp=document.getElementById('splash');if(!sp)return;
  var de=document.documentElement,body=document.body,done=false,t;
  function rm(){if(sp.parentNode)sp.parentNode.removeChild(sp);body.classList.remove('intro','reveal');de.style.removeProperty('--idelay')}
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){rm();return}
  var seen=false;try{seen=localStorage.getItem('dreams-intro')==='1'}catch(e){}
  var k=seen?0.55:1;
  sp.style.setProperty('--k',k);de.style.setProperty('--idelay',(2.9*k)+'s');
  try{
    var u='url("'+document.querySelector('#logo image').getAttribute('href')+'")';
    sp.style.setProperty('--logo',u);
    Array.prototype.forEach.call(sp.querySelectorAll('.sp-half'),function(h){h.style.backgroundImage=u});
  }catch(e){rm();return}
  body.classList.add('intro');
  function hap(x){try{if(window.AndroidApp&&AndroidApp.haptic)AndroidApp.haptic(x)}catch(e){}}
  setTimeout(function(){hap('impact')},980*k);
  function exit(){
    if(done)return;done=true;clearTimeout(t);
    var st=document.getElementById('spStage'),tg=document.querySelector('.brand svg'),d=Math.round(520*Math.max(k,.75));
    try{
      var a=st.getBoundingClientRect(),b=tg.getBoundingClientRect();
      var sc=b.width/a.width,dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
      st.animate([{transform:'translate(0px,0px) scale(1)'},{transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')'}],{duration:d+180,easing:'cubic-bezier(.65,0,.2,1)',fill:'forwards'});
      ['spWord','spTag'].forEach(function(id){document.getElementById(id).animate([{opacity:1},{opacity:0}],{duration:240,fill:'forwards'})});
      Array.prototype.forEach.call(sp.querySelectorAll('.sp-glow,.sp-flash'),function(el){el.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'})});
      sp.animate([{backgroundColor:'rgb(0,0,0)'},{backgroundColor:'rgba(0,0,0,0)'}],{duration:d,delay:140,fill:'forwards',easing:'ease'});
    }catch(e){}
    body.classList.add('reveal');
    setTimeout(rm,d+420);
    try{localStorage.setItem('dreams-intro','1')}catch(e){}
  }
  t=setTimeout(exit,2800*k);
  sp.addEventListener('click',exit);
  setTimeout(rm,9000);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var items=[],urls=[],query='',current=null,editing=null,pend={pdf:null,cover:null,userCover:false,m3d:null,rm3d:false,present:null,rmPres:false,kind:'glb'},token=0;

  var DB={db:null,mem:{},
    open:function(){var s=this;return new Promise(function(res){try{var r=indexedDB.open('dreams-app',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('d',{keyPath:'id'})};
      r.onsuccess=function(){s.db=r.result;res()};r.onerror=function(){res()}}catch(e){res()}})},
    all:function(){var s=this;return new Promise(function(res){
      if(!s.db){res(Object.keys(s.mem).map(function(k){return s.mem[k]}));return}
      try{var q=s.db.transaction('d').objectStore('d').getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}})},
    put:function(o){var s=this;return new Promise(function(res,rej){
      if(!s.db){s.mem[o.id]=o;res();return}

    del:function(id){var s=this;return new Promise(function(res){
      if(!s.db){delete s.mem[id];res();return}
      try{var t=s.db.transaction('d','readwrite');t.objectStore('d').delete(id);t.oncomplete=function(){res()};t.onerror=function(){res()}}catch(e){res()}})}
  };

  function today(){return new Date().toLocaleDateString('sv-SE')}
  function parse(s){var p=(s||today()).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function hue(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%360;return 200+(h%80)}
  function uid(){return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function genHTML(id){return '<div class="gen" style="--h:'+hue(id)+'"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#logo"/></svg></div>'}

  function coverHTML(d){
    if(d.cover){var u=URL.createObjectURL(d.cover);urls.push(u);return '<img src="'+u+'" alt="">'}
    return genHTML(d.id);
  }

  function render(){
    urls.forEach(function(u){URL.revokeObjectURL(u)});urls=[];
    var q=query.trim().toLowerCase();
    var list=items.filter(function(d){return !q||d.title.toLowerCase().indexOf(q)>-1})
      .sort(function(a,b){return parse(b.date)-parse(a.date)});
    $('#count').textContent=String(items.length);
    if(!list.length){$('#list').innerHTML='<p class="empty">'+(items.length?'Nada encontrado.':'Nenhum DREAMS ainda. Toque em Adicionar DREAMS.')+'</p>';return}
    var yr=new Date().getFullYear();
    var pop=firstRender;firstRender=false;
    $('#list').innerHTML=list.map(function(d,ix){
      var dt=parse(d.date),fmt=dt.toLocaleDateString('pt-BR',dt.getFullYear()!==yr?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'});
      return '<button class="card'+(pop?' pop':'')+'" style="--n:'+ix+'" data-id="'+d.id+'"><div class="cover">'+coverHTML(d)+(d.example?'<span class="tag">EXEMPLO</span>':'')+((d.m3d||d.present)?'<span class="tagr">'+(d.m3d?'<span>3D</span>':'')+(d.present?'<span>▶</span>':'')+'</span>':'')+'</div>'+
        '<div class="ct">'+esc(d.title)+'</div><div class="cd">'+fmt+'</div></button>';
    }).join('');
  }

  function squareBlob(src,sw,sh,top){
    var size=Math.min(sw,sh),c=document.createElement('canvas');c.width=c.height=Math.min(size,1080);

    return new Promise(function(res){c.toBlob(function(b){res(b)},'image/jpeg',.93)});
  }
  function imageCover(file){return createImageBitmap(file).then(function(bmp){return squareBlob(bmp,bmp.width,bmp.height,false)})}
  function pdfCover(file){

      .then(function(doc){return doc.getPage(1)}).then(function(p){
        var v0=p.getViewport({scale:1}),v=p.getViewport({scale:1400/v0.width}),c=document.createElement('canvas');
        c.width=v.width;c.height=v.height;
        return p.render({canvasContext:c.getContext('2d'),viewport:v}).promise.then(function(){return squareBlob(c,c.width,c.height,true)});
      }).catch(function(){return null});
  }

  function openViewer(d){
    current=d;var my=++token;
    $('#vtitle').textContent=d.title;$('#vdel').textContent='Excluir';$('#vdel').dataset.arm='';setupTabs(d);
    $('#viewer').hidden=false;document.body.style.overflow='hidden';$('#viewer').scrollTop=0;
    var box=$('#pages');box.innerHTML='';
    if(!d.pdf){box.innerHTML='<div class="note">Este é um exemplo, ainda sem PDF.<br><button class="pill" id="attach">Anexar PDF</button></div>';
      $('#attach').onclick=function(){openSheet(d)};return}
    if(!window.pdfjsLib){box.innerHTML='<div class="note">Não consegui carregar o leitor de PDF. Confira a conexão e abra de novo.</div>';return}
    loadPdf(d,my);
  }
  function closeViewer(){token++;cleanup3d();setImm(false);$('#fs').hidden=true;current=null;$('#viewer').hidden=true;$('#pages').innerHTML='';document.body.style.overflow=''}


  /* ---------- 3D ---------- */
  var MV_SRC='https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js';
  var mvPromise=null,urls3d=[],stop3d=null,t3d=0;
  var KINDS={
    glb:{accept:'.glb,model/gltf-binary,application/octet-stream',label:'Escolher modelo .glb',multi:false},
    html:{accept:'.html,.htm,text/html',label:'Escolher página .html',multi:false},
    frames:{accept:'image/*',label:'Escolher imagens do giro',multi:true}
  };
  function loadMV(){
    if(window.customElements&&customElements.get('model-viewer'))return Promise.resolve();
    if(mvPromise)return mvPromise;

      var s=document.createElement('script');s.type='module';s.src=MV_SRC;
      s.onload=function(){customElements.whenDefined('model-viewer').then(res,rej)};

    });

  }
  function cleanup3d(){
    t3d++;
    if(stop3d){try{stop3d()}catch(e){}stop3d=null}
    urls3d.forEach(function(u){URL.revokeObjectURL(u)});urls3d=[];
    var st=$('#stage');st.innerHTML='';st.hidden=true;
  }
  function setupTabs(d){
    var t=$('#vtabs'),h='';
    if(d.m3d||d.present){
      h='<button type="button" data-t="pdf">PDF</button>';
      if(d.m3d)h+='<button type="button" data-t="3d">3D</button>';
      if(d.present)h+='<button type="button" data-t="present">Apresentação</button>';
      t.hidden=false;t.innerHTML=h;
    }else{t.hidden=true;t.innerHTML=''}
    showTab('pdf');
  }
  function showTab(k){
    Array.prototype.forEach.call($('#vtabs').querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.t===k)});
    cleanup3d();setImm(false);
    $('#pages').hidden=(k!=='pdf');
    var fs=$('#fs');fs.hidden=true;
    if(k==='pdf'||!current)return;
    var st=$('#stage'),h=document.querySelector('.vbar').offsetHeight;
    st.hidden=false;st.style.top=h+'px';fs.style.top=(h+10)+'px';
    if(k==='3d'&&current.m3d){render3d(current);fs.hidden=false}
    else if(k==='present'&&current.present){
      var mine=t3d,cid=current.id;note(st,'Carregando apresentação...');
      iframeScene(current.present.file,current.title,st,function(){return mine===t3d&&current&&current.id===cid});fs.hidden=false;
    }
  }
  function note(st,msg){st.innerHTML='<div class="note">'+msg+'</div>'}
  function render3d(d){
    var st=$('#stage'),m=d.m3d,mine=t3d;
    note(st,'Carregando 3D...');
    var alive=function(){return mine===t3d&&current&&current.id===d.id};
    if(m.type==='glb'){
      loadMV().then(function(){
        if(!alive())return;
        var u=URL.createObjectURL(m.files[0]);urls3d.push(u);
        var mv=document.createElement('model-viewer');
        mv.setAttribute('src',u);mv.setAttribute('camera-controls','');mv.setAttribute('auto-rotate','');
        mv.setAttribute('shadow-intensity','1');mv.setAttribute('touch-action','none');
        mv.setAttribute('interaction-prompt','none');mv.setAttribute('alt',d.title);
        mv.addEventListener('error',function(){if(alive())note(st,'Não consegui abrir este modelo 3D. Use um arquivo .glb.')});

      }).catch(function(){if(alive())note(st,'O visualizador 3D não carregou. Confira a conexão e tente de novo.')});
    }else if(m.type==='html'){
      iframeScene(m.files[0],d.title,st,alive);

      framesView(d,st,alive);
    }
  }
  function iframeScene(file,title,st,alive){
    file.text().then(function(txt){
      if(!alive())return;

      st.innerHTML='';st.appendChild(f);
    }).catch(function(){if(alive())note(st,'Não consegui abrir esta página.')});
  }
  function framesView(d,st,alive){
    var files=m3dFiles(d),n=files.length;
    Promise.all(files.map(function(f){return createImageBitmap(f)})).then(function(bmps){
      if(!alive()){bmps.forEach(function(b){b.close&&b.close()});return}
      var cv=document.createElement('canvas'),ctx=cv.getContext('2d');
      var idx=0,auto=true,raf=0,last=0,drag=false,sx=0,si=0,w0=1;
      var hint=document.createElement('div');hint.className='shint';
      hint.innerHTML='<span>Arraste para girar</span><button type="button">Pausar</button>';
      var btn=hint.querySelector('button');
      st.innerHTML='';st.appendChild(cv);st.appendChild(hint);
      function draw(){
        ctx.clearRect(0,0,cv.width,cv.height);
        var b=bmps[((Math.round(idx)%n)+n)%n],sc=Math.min(cv.width/b.width,cv.height/b.height)*.94;
        var w=b.width*sc,h=b.height*sc;ctx.drawImage(b,(cv.width-w)/2,(cv.height-h)/2,w,h);
      }
      function size(){var r=st.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);w0=r.width||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);draw()}
      function tick(t){
        if(auto&&!drag){idx+=(t-last)*n/9000;draw()}
        last=t;raf=requestAnimationFrame(tick);
      }
      cv.addEventListener('pointerdown',function(e){drag=true;sx=e.clientX;si=idx;auto=false;btn.textContent='Girar';try{cv.setPointerCapture(e.pointerId)}catch(x){}});
      cv.addEventListener('pointermove',function(e){if(!drag)return;idx=si-(e.clientX-sx)/w0*n;draw()});
      var up=function(){drag=false};
      cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
      btn.onclick=function(){auto=!auto;btn.textContent=auto?'Pausar':'Girar'};
      window.addEventListener('resize',size);
      stop3d=function(){cancelAnimationFrame(raf);window.removeEventListener('resize',size);bmps.forEach(function(b){b.close&&b.close()})};
      size();raf=requestAnimationFrame(function(t){last=t;tick(t)});
    }).catch(function(){if(alive())note(st,'Não consegui abrir as imagens do giro.')});
  }
  function m3dFiles(d){return d.m3d.files}
  function prepFrames(files,onp){
    files=files.slice().sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
    if(files.length>90){var out=[];for(var i=0;i<90;i++)out.push(files[Math.floor(i*files.length/90)]);files=out}
    var res=[],i=0;
    function next(){
      if(i>=files.length)return Promise.resolve(res);
      return createImageBitmap(files[i]).then(function(bmp){
        var mx=files.length<=36?1080:(files.length<=60?900:720),sc=Math.min(1,mx/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
        c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
        c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);bmp.close&&bmp.close();
        return new Promise(function(ok){c.toBlob(function(b){ok(b)},'image/webp',.85)});
      }).then(function(b){res.push(b);i++;onp(i,files.length);return next()});
    }
    return next();
  }
  function setKind(k){
    pend.kind=k;
    Array.prototype.forEach.call($('#seg3').querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.k===k)});
    var f=$('#f3d');f.accept=KINDS[k].accept;f.multiple=KINDS[k].multi;f.value='';
    $('#b3d').textContent=KINDS[k].label;
    if(pend.m3d&&pend.m3d.type!==k)pend.m3d=null;
    update3dName();
  }
  function update3dName(){
    var cur=editing&&editing.m3d&&!pend.rm3d;
    $('#n3d').textContent=pend.m3d?pend.m3d.name:(cur?'3D atual mantido: '+editing.m3d.name:'Sem 3D');
    $('#rm3d').hidden=!(pend.m3d||cur);
  }

lar simples. Use CSS animations/transitions, requestAnimationFrame e IntersectionObserver.\n- Respeite prefers-reduced-motion: sem movimento, só um fade curto.\n- Sem alert, confirm, prompt, formulários, vídeo com som ou áudio automático.\n\nFORMATO\n- 6 a 9 cenas em tela cheia, uma por vez, como stories premium.\n- Navegação: toque no lado direito avança, toque no lado esquerdo volta, arrastar para cima, baixo ou os lados também troca de cena. Barra de progresso fina e segmentada no topo. Nenhum outro botão visível.\n- Cena 1 é a capa: título gigante, frase curta, entrada cinematográfica.\n- A última cena fecha com uma frase forte e um botão \"Rever\" que volta ao início. A apresentação não fecha sozinha. Avanço automático opcional a cada 6 s, pausando enquanto eu seguro o dedo.\n\nDIREÇÃO DE ARTE\n- Tema escuro igual ao app: fundo #000, texto #F5F5F7, secundário #8E8E93, destaque azul #0A84FF, cartões #101012. Um destaque por cena.\n- Tipografia: título de 44 a 64 px, peso 800, espaçamento -0,03em; corpo de 18 a 20 px; nada abaixo de 15 px. Margens de 24 px. Um assunto por cena, no máximo 25 palavras.\n- Ilustrações e gráficos vetoriais minimalistas ou gradientes suaves. Nada de clip-art, emoji ou foto genérica.\n\nMOTION (o ponto central)\n- Entrada de cada cena em sequência (stagger de 60 a 90 ms): o texto sobe com fade e um leve blur que se desfaz, os títulos se revelam por máscara, os números contam de 0 até o valor.\n- Fundo vivo e discreto: gradientes lentos, partículas leves ou formas flutuando em paralaxe, em camadas com velocidades diferentes.\n- Transição entre cenas: a atual sai (fade, deslocamento de 24 px e escala 0,98) e a próxima entra com easing cubic-bezier(.2,.8,.2,1), de 500 a 700 ms. Nenhum corte seco.\n- Microinterações: um pulso discreto no lado tocado. A barra de progresso preenche suavemente.\n- Ritmo: faça pausas. Para cada duas cenas calmas, uma cena de impacto (palavra gigante ou número grande).\n\nCONTEÚDO (adapte ao meu sonho)\nVisão,   $('#prompt').onclick=openPrompt;
  $('#pclose').onclick=closeSheet;
  dragSheet($('#sheet'),closeSheet);dragSheet($('#psheet'),closeSheet);dragSheet($('#qsheet'),closeSheet);
  $('#fs').onclick=function(){setImm(!$('#viewer').classList.contains('imm'))};
  setImm(false);
  $('#pages').addEventListener('pointerup',function(e){
    if(!pdfDoc)return;
    var t=Date.now();
    if(t-lastTap<300&&Math.abs(e.clientX-lastX)<30&&Math.abs(e.clientY-lastY)<30){
      lastTap=0;pdfZoom=pdfZoom>1?1:2;$('#pages').classList.toggle('z',pdfZoom>1);hap('tick');drawPdf(token);
    }else{lastTap=t;lastX=e.clientX;lastY=e.clientY}
  });
  $('#fPres').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    if(!/\.html?$/i.test(f.name)){$('#err').textContent='Use um arquivo .html.';return}
    $('#err').textContent='';pend.present={name:f.name,file:f};pend.rmPres=false;updatePres();
  });
  $('#rmPres').onclick=function(){pend.present=null;pend.rmPres=true;$('#fPres').value='';updatePres()};
  var lp=null,lpx=0,lpy=0,lpl=$('#list');
  lpl.addEventListener('pointerdown',function(e){
    var c=e.target.closest('.card');if(!c)return;
    lpHit=false;lpx=e.clientX;lpy=e.clientY;clearTimeout(lp);
    lp=setTimeout(function(){var d=items.find(function(x){return x.id===c.dataset.id});if(d){lpHit=true;hap('heavy');openQuick(d)}},480);
  });
  lpl.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-lpx)>10||Math.abs(e.clientY-lpy)>10)clearTimeout(lp)});
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){lpl.addEventListener(ev,function(){clearTimeout(lp)})});
  lpl.addEventListener('contextmenu',function(e){e.preventDefault()});
  $('#qclose').onclick=closeSheet;
  $('#qopen').onclick=function(){var d=qItem();closeSheet();if(d)openViewer(d)};
  $('#qedit').onclick=function(){var d=qItem();closeSheet();if(d)openSheet(d)};
  $('#qdel').onclick=function(){
    var b=$('#qdel');
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Toque de novo para excluir';hap('warn');return}
    var id=qid;DB.del(id).then(function(){items=items.filter(function(x){return x.id!==id});closeSheet();render();hap('success')});
  };

  $('#pseg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setP(b.dataset.p)});
  $('#pcopy').onclick=function(){
    var b=$('#pcopy'),t=PROMPTS[pkind];
    copyText(t).then(function(){b.textContent='Copiado';hap('success')},function(){b.textContent='Toque no texto e copie'});
    setTimeout(function(){b.textContent='Copiar prompt'},2200);
  };
  $('#list').addEventListener('click',function(e){
    if(lpHit){lpHit=false;return}
    var c=e.target.closest('.card');if(!c)return;
    var d=items.find(function(x){return x.id===c.dataset.id});if(d)openViewer(d);
  });
  $('#vclose').onclick=closeViewer;
  $('#vedit').onclick=function(){if(current)openSheet(current)};
  $('#vdel').onclick=function(){
    var b=$('#vdel');
    if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Confirmar';setTimeout(function(){if(b.dataset.arm==='1'){b.dataset.arm='';b.textContent='Excluir'}},3500);return}
    var id=current.id;DB.del(id).then(function(){items=items.filter(function(x){return x.id!==id});closeViewer();render()});
  };
  $('#searchBtn').onclick=function(){var s=$('#search');s.classList.toggle('on');if(s.classList.contains('on'))$('#q').focus();else{query='';$('#q').value='';render()}};
  $('#q').addEventListener('input',function(e){query=e.target.value;render()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(!$('#viewer').hidden)closeViewer()}});

  /* botão Voltar do Android: fecha janela aberta antes de sair */
  window.dreamsBack=function(){
    if($('#viewer').classList.contains('imm')){setImm(false);return true}
    if(!$('#sheet').hidden||!$('#psheet').hidden||!$('#qsheet').hidden){closeSheet();return true}
    if(!$('#viewer').hidden){closeViewer();return true}
    return false;
  };

  function seeded(){try{return localStorage.getItem('dreams-seeded')==='1'}catch(e){return false}}
  DB.open().then(function(){return DB.all()}).then(function(all){
    items=all;
    render();
    if(window.dreamsShared)window.dreamsShared();
  });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</html>
